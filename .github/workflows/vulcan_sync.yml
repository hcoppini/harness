name: Vulcan UONET+ Daily Auto-Sync

on:
  schedule:
    # 12:15 UTC = 14:15 Warsaw time (CEST), Mon-Fri right after school ends
    - cron: '15 12 * * 1-5'
    # 15:00 UTC = 17:00 Warsaw time (CEST), Mon-Fri before evening study session
    - cron: '00 15 * * 1-5'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Headless Vulcan & Supabase Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          VULCAN_CONFIG_JSON: ${{ secrets.VULCAN_CONFIG_JSON }}
        run: |
          python scripts/sync_vulcan_daily.py
