name: Vulcan Cloud Auto-Sync

on:
  schedule:
    # 06:00, 12:00, 15:00 UTC corresponds to 08:00, 14:00, 17:00 CEST (Polish local time)
    - cron: '0 6,12,15 * * *'
  workflow_dispatch:

jobs:
  sync:
    name: Sync Vulcan E-Dziennik to Supabase Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Headless Vulcan Cloud Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          VULCAN_CONFIG_JSON: ${{ secrets.VULCAN_CONFIG_JSON }}
        run: |
          python scripts/sync_vulcan_cloud.py
