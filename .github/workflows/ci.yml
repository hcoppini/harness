name: Harness CI — Tests & Integrity Guards

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Pytest + Schema & Single-Tree Guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js (for JS timeline math tests)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Static Guardrails (JSON Schemas, Single UI Tree, Duplicate Defs)
        run: |
          python - << 'EOF'
          import ast, json, pathlib, sys

          root = pathlib.Path(".")
          assert not (root / "ui").exists(), "Duplicate ui/ directory must not exist"
          assert not (root / "client").exists(), "Deprecated Expo client/ directory must not exist"

          for jf in ["data/schedules.json", "data/metro_roadmap.json", "data/school_timetable.json", "data/gym_routines.json", "data/operating_mode.json", "data/travel_windows.json"]:
              p = root / jf
              assert p.exists(), f"Missing required data file: {jf}"
              json.loads(p.read_text(encoding="utf-8"))

          # Check no duplicate top-level function definitions in app/ and engine/
          for folder in ("app", "engine"):
              for pyf in (root / folder).rglob("*.py"):
                  tree = ast.parse(pyf.read_text(encoding="utf-8"), filename=str(pyf))
                  seen = set()
                  for node in tree.body:
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                          assert node.name not in seen, f"Duplicate top-level def {node.name} in {pyf}"
                          seen.add(node.name)
          print("All static guardrails passed.")
          EOF

      - name: Run Full Pytest Suite
        run: pytest tests/ -v
